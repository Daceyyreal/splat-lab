<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>splat-lab — live 3DGS compression</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="canvas-host"></div>

    <header class="topbar">
      <div class="brand">splat<span>·</span>lab</div>
      <div class="sub">live, in-browser 3D Gaussian Splatting compression</div>
    </header>

    <aside class="panel">
      <div class="readout">
        <div class="metric big">
          <span id="size" class="num">—</span><span class="unit">MB</span>
          <label>compressed</label>
        </div>
        <div class="metric">
          <span id="reduction" class="num accent">—</span><span class="unit">%</span>
          <label>smaller</label>
        </div>
        <div class="metric">
          <span id="count" class="num">—</span>
          <label>gaussians</label>
        </div>
        <div class="metric faded">
          <span id="baseline" class="num">—</span><span class="unit">MB</span>
          <label>baseline</label>
        </div>
      </div>

      <div class="controls">
        <div class="ctrl">
          <div class="row"><label>opacity prune</label><span id="prune-val" class="val">5</span><span class="suffix">%ile</span></div>
          <input id="prune" type="range" min="0" max="20" step="0.5" value="5" />
        </div>
        <div class="ctrl">
          <div class="row"><label>scale cap</label><span id="scaleCap-val" class="val">1</span></div>
          <input id="scaleCap" type="range" min="0.1" max="3" step="0.1" value="1" />
        </div>
        <div class="ctrl">
          <div class="row"><label>SH degree</label><span id="sh-val" class="val">3</span></div>
          <input id="sh" type="range" min="0" max="3" step="1" value="3" />
        </div>
        <div class="ctrl">
          <div class="row"><label>quantization</label></div>
          <select id="quant">
            <option value="none">none (fp32)</option>
            <option value="fp16">fp16</option>
            <option value="mixed" selected>mixed (fp16 geo / int8 appr)</option>
            <option value="int8">int8 (watch it break)</option>
          </select>
        </div>
      </div>

      <div class="source">
        <button id="sample">load sample</button>
        <label class="filebtn">upload .ply<input id="file" type="file" accept=".ply" hidden /></label>
        <div id="status" class="status">upload a 3DGS .ply to begin</div>
      </div>
    </aside>
  </body>
  <script type="module" src="/src/main.ts"></script>
</html>
